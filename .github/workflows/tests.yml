name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The suite substitutes fakes for every platform backend, so it needs
      # neither a GPU, a microphone, a display server nor network access.
      - name: Install test dependencies
        run: python -m pip install --quiet numpy pytest

      - name: Run tests
        run: python -m pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts parse
        run: |
          bash -n install.sh
          bash -n uninstall.sh
      - name: Check python files compile
        run: python -m compileall -q whisper_dictate dictate_daemon.py
